{% extends 'base.html' %}
{% load socialaccount %}

{% block title %}Inicio de sesión{% endblock %}

{% block content %}
<div class="login-container">
  <h2>Iniciar sesión</h2>
  <form method="post" action="{% url 'accounts:login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Entrar</button>
  </form>
  <p><a href="{% provider_login_url 'google' %}">Continuar con Google</a></p>
  <p><a href="{% url 'accounts:password_reset' %}">¿Olvidaste tu contraseña?</a></p>
  <p>¿No tienes cuenta? <a href="{% url 'accounts:registro' %}">Regístrate aquí</a></p>
</div>
{% endblock %}
