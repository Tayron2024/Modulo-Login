{% extends 'base.html' %}

{% block title %}Nueva contraseña{% endblock %}

{% block content %}
<div class="login-container">
  <h2>Restablecer contraseña</h2>
  {% if validlink %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Cambiar contraseña</button>
  </form>
  {% else %}
  <p>El enlace de restablecimiento no es válido. <a href="{% url 'accounts:password_reset' %}">Solicita uno nuevo</a>.</p>
  {% endif %}
</div>
{% endblock %}
