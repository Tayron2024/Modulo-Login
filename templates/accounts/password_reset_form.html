{% extends 'base.html' %}

{% block title %}Recuperar contraseña{% endblock %}

{% block content %}
<div class="login-container">
  <h2>🔐 Recuperar contraseña</h2>
  <p style="margin-bottom:1rem;">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">📧 Enviar enlace de recuperación</button>
  </form>
  <p class="form-footer"><a href="{% url 'accounts:login' %}">← Volver a iniciar sesión</a></p>
</div>
{% endblock %}
