{% extends 'base.html' %}
{% load socialaccount %}

{% block title %}Registro de usuario{% endblock %}

{% block content %}
<div class="login-container">
  <h2>Crear cuenta</h2>
  <form method="post" action="{% url 'accounts:registro' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Registrarse</button>
  </form>
  <p><a href="{% provider_login_url 'google' %}">Registrarse con Google</a></p>
  <p>¿Ya tienes cuenta? <a href="{% url 'accounts:login' %}">Inicia sesión aquí</a></p>
</div>
{% endblock %}
